/* ===== Realm of Tenet — core: canvas, input, helpers, save data ===== */
const W = 480, H = 270;
const TAU = Math.PI * 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
cv.width = W; cv.height = H;
ctx.imageSmoothingEnabled = false;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rr = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (a, b, c, d) => Math.hypot(c - a, d - b);
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t) { const A = hex(a), B = hex(b); return 'rgb(' + Math.round(lerp(A[0], B[0], t)) + ',' + Math.round(lerp(A[1], B[1], t)) + ',' + Math.round(lerp(A[2], B[2], t)) + ')'; }

/* ---------- fit canvas to window ---------- */
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- input ---------- */
const input = {
  keys: {}, pressed: {}, px: -99, py: -99, down: false, downEdge: false, upEdge: null,
  moved: false, touch: false, pointers: new Map(), anyKey: false
};
addEventListener('keydown', e => {
  if (!e.repeat) { input.pressed[e.code] = true; input.anyKey = true; }
  input.keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
  audio.unlock();
});
addEventListener('keyup', e => { input.keys[e.code] = false; });
addEventListener('blur', () => { input.keys = {}; input.pointers.clear(); input.down = false; });
function toGame(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
cv.addEventListener('pointerdown', e => {
  try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  const [x, y] = toGame(e);
  input.pointers.set(e.pointerId, { id: e.pointerId, x, y, sx: x, sy: y, type: e.pointerType });
  if (e.pointerType === 'touch') input.touch = true;
  input.px = x; input.py = y; input.down = true; input.downEdge = true; input.moved = true;
  audio.unlock(); e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  const [x, y] = toGame(e); input.px = x; input.py = y; input.moved = true;
  const p = input.pointers.get(e.pointerId); if (p) { p.x = x; p.y = y; }
});
function pEnd(e) {
  const [x, y] = toGame(e); input.px = x; input.py = y;
  input.pointers.delete(e.pointerId);
  input.upEdge = { x, y }; if (input.pointers.size === 0) input.down = false;
  if (e.pointerType === 'touch') { input.px = -99; input.py = -99; }
}
cv.addEventListener('pointerup', pEnd);
cv.addEventListener('pointercancel', pEnd);
cv.addEventListener('contextmenu', e => e.preventDefault());
function endFrameInput() { input.pressed = {}; input.downEdge = false; input.upEdge = null; input.moved = false; input.anyKey = false; }

    p.gold += d.gold + d.bonusG; p.gems += d.gems + d.bonusGem; p.level = d.lvl; p.xp = d.xp; p.kills += d.kills; p.runGold += d.gold;
    p.maxWave = Math.max(p.maxWave, d.wave); p.bossKills += d.bossKills; p.best[d.rid] = Math.max(p.best[d.rid] || 0, d.waveDone); p.runs++; p.time += d.time; p.tut = false;
    if (d.win) { p.cleared[d.rid] = true; const nx = REGIONS[idx + 1]; if (nx) { d.unlocked = d.firstClear ? nx.name : null; p.region = nx.id; } }

    this.stars = []; for (let i = 0; i < 40; i++) this.stars.push({ x: rr(0, W), y: rr(0, H), s: Math.random() });

let cur = null;

let last = performance.now(), acc = 0; const STEP = 1 / 60;

  requestAnimationFrame(frame);
  let dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
  let n = 0; while (acc >= STEP && n < 5) { try { cur.update(STEP); } catch (e) { console.error(e); } updateFade(STEP); acc -= STEP; n++; }
  if (n === 0) { /* keep edges alive until consumed */ }
  try { ctx.imageSmoothingEnabled = false; cur.draw(ctx); drawFade(ctx); } catch (e) { console.error(e); }
  endFrameInput();
}
